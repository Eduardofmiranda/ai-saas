server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (rotas do frontend: /, /fluxos, /editor, /ai, /knowledge,
    # /whatsapp, /admin). NAO proxyar esses caminhos para o backend sem token,
    # senao a navegacao do SPA retorna "Not authenticated" via nginx.
    # A API usa o prefixo /api/ (abaixo), separado das rotas do frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Backend API - UNICO caminho da API (mesma origem) ----
    # O frontend chama /api/... ; o trailing slash em proxy_pass http://backend:8000/
    # descarta o prefixo /api, entregando /knowledge/, /auth/login, etc. ao backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Proxy websocket for Evolution webhook if needed
    location /webhook/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}