# ============================================================================
# CONFIGURACAO DE DESENVOLVIMENTO (NAO e auto-carregada em producao)
# Use explicitamente em desenvolvimento:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# O Compose anteriormente auto-carregava este arquivo por se chamar
# "override"; renomeado para que `docker compose up` na VPS rode a producao.
# ============================================================================
services:
  backend:
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  celery-worker:
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  celery-beat:
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  frontend:
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000