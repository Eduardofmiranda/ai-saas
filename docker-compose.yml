services:
  # NOTA: Usando Supabase como banco, o Postgres local NAO e necessario.
  # Se quiser Postgres local, descomente este servico e use o .env local.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: ai-saas-postgres
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     POSTGRES_DB: ai_saas
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - ai-saas-network

  redis:
    image: redis:7-alpine
    container_name: ai-saas-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-saas-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-saas-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-groq}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-qwen/qwen3.8-27b}
      DEFAULT_AI_API_KEY: ${DEFAULT_AI_API_KEY:-}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - ai-saas-network
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-saas-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-groq}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-qwen/qwen3.8-27b}
      DEFAULT_AI_API_KEY: ${DEFAULT_AI_API_KEY:-}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-saas-network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-saas-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-saas-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-saas-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-saas-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ai-saas-network:
    driver: bridge