services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    # NAO usar env_file: .env (injeta variaveis da aplicacao que conflitam)
    environment:
      - SERVER_URL=http://2.25.122.157:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_AUTH_KEY}
      # Banco OPERACIONAL da Evolution (OBRIGATORIO no startup: o entrypoint
      # oficial roda deploy_database.sh, que exige DATABASE_PROVIDER valido +
      # banco acessivel e da exit 1 caso contrario — mesmo com
      # DATABASE_ENABLED=false. NUNCA remover estas duas variaveis.
      # Padrao: postgres local do compose (mesma rede). Para usar Supabase:
      #   EVOLUTION_DATABASE_CONNECTION_URI=postgresql://<user>:<pass>@<pooler>:5432/evolution
      - DATABASE_ENABLED=${EVOLUTION_DATABASE_ENABLED:-false}
      - DATABASE_PROVIDER=${EVOLUTION_DATABASE_PROVIDER:-postgresql}
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_CONNECTION_URI:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution}
      - CACHE_REDIS_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=WARN
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - ai-saas-network

networks:
  ai-saas-network:
    external: true
    name: ai-saas_ai-saas-network

volumes:
  evolution_instances:
  evolution_store:
